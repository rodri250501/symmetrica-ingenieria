<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMF-Beam Design · Optimizador Inteligente de Vigas</title>

    <!-- IBM Plex Sans + Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Chart.js para el gráfico de optimización -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Librerías para exportar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --bg-app: #e8ebef;
            --bg-panel: #ffffff;
            --bg-panel-alt: #f4f6f8;
            --bg-topbar: #16222e;
            --bg-rail: #101922;
            --border: #d6dbe1;
            --border-strong: #b7c0ca;
            --ink: #182430;
            --ink-soft: #5c6b7a;
            --ink-faint: #8996a3;
            --accent: #1c72c4;
            --accent-dark: #114f8c;
            --ok: #1a7d3f;
            --ok-bg: #e5f5ea;
            --fail: #c22a2a;
            --fail-bg: #fbe9e9;
            --warn: #a8660a;
            --warn-bg: #fbf1de;
            --radius: 6px;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--bg-app);
            color: var(--ink);
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }
        .mono { font-family: 'IBM Plex Mono', monospace; }

        .app-shell {
            display: grid;
            grid-template-columns: 60px 1fr;
            grid-template-rows: 66px 40px 1fr 26px;
            grid-template-areas:
                "rail topbar"
                "rail tabs"
                "rail main"
                "rail status";
            height: 100vh;
            overflow: hidden;
        }
        .topbar {
            grid-area: topbar;
            background: var(--bg-topbar);
            display: flex;
            align-items: center;
            gap: 28px;
            padding: 0 36px;
            color: #eef2f6;
            border-bottom: 1px solid #0a121a;
            height: 66px;
            min-width: 0;
            overflow-x: auto;
            overflow-y: hidden;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 16px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .brand-mark { width: 24px; height: 24px; }
        .brand-mark svg { width: 100%; height: 100%; display: block; }
        .brand-sub {
            color: #93a4b3;
            font-size: 12.5px;
            border-left: 1px solid #35485a;
            padding-left: 16px;
            margin-left: 6px;
            display: none;
        }
        @media (min-width: 780px) { .brand-sub { display: inline; } }
        .topbar-field {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: var(--radius);
            padding: 7px 16px;
            flex-shrink: 0;
        }
        .topbar-field label {
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #93a4b3;
            white-space: nowrap;
        }
        .topbar-field input {
            background: transparent;
            border: none;
            color: #eef2f6;
            font-size: 13px;
            width: 150px;
            outline: none;
            font-family: 'IBM Plex Sans', sans-serif;
        }
        .topbar-field input::placeholder { color: #6b7c8c; }

        /* Selector de criterio en topbar */
        .topbar-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: var(--radius);
            padding: 4px 8px;
            flex-shrink: 0;
        }
        .topbar-selector label {
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #93a4b3;
            white-space: nowrap;
        }
        .topbar-selector select {
            background: transparent;
            border: none;
            color: #eef2f6;
            font-size: 13px;
            outline: none;
            font-family: 'IBM Plex Sans', sans-serif;
            cursor: pointer;
            appearance: none;
            padding: 4px 20px 4px 4px;
        }
        .topbar-selector select option {
            background: #16222e;
            color: #eef2f6;
        }

        .topbar-spacer { flex: 1; }
        .topbar-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }

        .btn {
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 12.5px;
            font-weight: 600;
            border-radius: var(--radius);
            border: 1px solid transparent;
            padding: 8px 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: background-color .12s, border-color .12s;
        }
        .btn svg { width: 14px; height: 14px; flex: none; }
        .btn-accent { background: var(--accent); color: #fff; }
        .btn-accent:hover { background: var(--accent-dark); }
        .btn-ghost-dark { background: transparent; color: #dbe4ec; border-color: rgba(255,255,255,0.22); }
        .btn-ghost-dark:hover { background: rgba(255,255,255,0.08); }
        .btn-outline { background: #fff; color: var(--ink); border-color: var(--border-strong); }
        .btn-outline:hover { background: var(--bg-panel-alt); }
        .btn-sm { padding: 4px 9px; font-size: 11.5px; }
        .btn-pdf {
            background: #0b6e4f;
            color: white;
            border: none;
            padding: 0.7rem 2rem;
            font-weight: 600;
            border-radius: var(--radius);
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-pdf:hover { background: #0a5a40; }

        .icon-rail {
            grid-area: rail;
            background: var(--bg-rail);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
            gap: 4px;
            min-width: 0;
        }
        .rail-btn {
            width: 44px; height: 44px;
            border-radius: var(--radius);
            display: flex; align-items: center; justify-content: center;
            color: #9fb0c0;
            cursor: pointer;
            position: relative;
            border: 1px solid transparent;
        }
        .rail-btn svg { width: 19px; height: 19px; }
        .rail-btn:hover { color: #f1f5f9; background: rgba(255,255,255,0.07); }
        .rail-btn.active {
            color: #fff;
            background: rgba(28,114,196,0.25);
            border-color: rgba(28,114,196,0.55);

        .rail-btn.active::before {
            content: "";

            left: -10px; top: 6px; bottom: 6px;
            width: 3px;
            background: var(--accent);
            border-radius: 0 3px 3px 0;

        .tab-strip {
            grid-area: tabs;
            background: var(--bg-panel);
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding: 0 36px;
            gap: 0;
            overflow-x: auto;
            overflow-y: hidden;

        .tab { padding: 8px 16px; cursor: pointer; border-bottom: 3px solid transparent; font-weight: 600; font-size: 13px; white-space: nowrap; }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

        .main-area {
            grid-area: main;
            background: var(--bg-app);
            overflow: auto;

            gap: 20px;
            margin-bottom: 20px;

        .form-group {

            margin-bottom: 6px;

        /* Checkboxes para diámetros */
        .diametros-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;

        .checkbox-item input[type="checkbox"] {

            border-radius: var(--radius);

        .tabla-comparativa thead {

            font-weight: 600;
            border-bottom: 2px solid var(--border);
            font-size: 12px;

            border-bottom: 1px solid var(--border);

        .tabla-comparativa tbody tr:hover {

            display: inline-block;

            border-radius: 4px;
            font-weight: 600;
            font-size: 11px;
        }

        .badge-optimal {
            background: var(--ok-bg);
            color: var(--ok);
        }

        .badge-economic {
            background: var(--warn-bg);
            color: var(--warn);
        }

        .badge-robust {
            background: #e8f0f8;
            color: #1c72c4;
        }

        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .chart-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            position: relative;
            height: 350px;
        }

        .chart-card canvas {
            max-height: 320px;
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin: 20px 0;
        }

        /* Info messages */
        .info-msg {
            background: var(--ok-bg);
            color: var(--ok);
            padding: 12px;
            border-radius: var(--radius);
            margin-top: 12px;
            font-size: 13px;
            border-left: 4px solid var(--ok);
        }

        .btn-seleccionar {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all .12s;

        .btn-seleccionar:hover {
            background: var(--accent);
            color: #fff;
        }

        .btn-seleccionar.seleccionado {
            background: var(--accent);
            color: #fff;
        }

        /* Summary box */
        .summary-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin: 20px 0;

        .summary-item {
            background: #f8f9fa;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
        }

        .summary-item-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--ink-soft);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .summary-item-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--ink);
        }

        @media (max-width: 768px) {
            .charts-row {
                grid-template-columns: 1fr;
            }
            .topbar {
                flex-direction: column;
                height: auto;
                gap: 12px;
                padding: 12px 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }

                        <rect x="14" y="3" width="7" height="7"></rect>

                        <rect x="3" y="14" width="7" height="7"></rect>

                </div>

        <!-- TABS -->

        <!-- MAIN -->

            <!-- PANEL DE ENTRADA -->
            <div class="panel">
                <h3 style="margin-top: 0;">Parámetros de Diseño</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label>Momento Último (kN·m)</label>

                    <div class="form-group">
                        <label>fy (MPa)</label>
                        <select id="fy">

                        </select>

                <div class="form-row">

    <!-- SCRIPTS -->
    <script>
        let criterioActual = 'optimal';
        let chartScatter = null;
        let chartPie = null;

        // ================================================================
        //  CÁLCULO DE ACERO
        // ================================================================

        function calcularAcero(Mu_kN, b, h, fck, fy, rec = 5) {
            const d = h - rec;
            if (d <= 0) {
                return { As: 0, rho: 0, a: 0, d, valida: false, mensaje: 'd<=0' };
            }

            const fck_mpa = parseFloat(fck);
            const fy_mpa = parseFloat(fy);

            // ---- CONVERSIÓN DE UNIDADES (CRÍTICO) ----
            // fck y fy llegan en MPa (N/mm²). Como b, h, d están en cm y Mu se pasa a kN·cm,
            // fck y fy deben convertirse a kN/cm² (1 MPa = 0.1 kN/cm²) antes de usarse en la
            // ecuación de equilibrio. Omitir esta conversión sobreestima ~10x la capacidad de
            // la sección y produce un As artificialmente bajo (falla cuantía mínima siempre).
            const fck_kNcm2 = fck_mpa / 10;
            const fy_kNcm2 = fy_mpa / 10;

            const Mu_kNcm = Mu_kN * 100;

            const phi = 0.9;
            const beta1 = (fck_mpa <= 28) ? 0.85 : Math.max(0.65, 0.85 - 0.05 * (fck_mpa - 28) / 7);

            const A = (phi * fy_kNcm2 * fy_kNcm2) / (2 * 0.85 * fck_kNcm2 * b);
            const B = -(phi * fy_kNcm2 * d);
            const C = Mu_kNcm;

            const discriminante = B * B - 4 * A * C;
            if (discriminante < 0) {
                return { As: 0, rho: 0, a: 0, d, valida: false, mensaje: 'disc<0' };
            }

            const As1 = (-B + Math.sqrt(discriminante)) / (2 * A);
            const As2 = (-B - Math.sqrt(discriminante)) / (2 * A);
            let As = (As1 > 0 && As1 < As2) ? As1 : As2;
            if (As <= 0) As = (As1 > 0) ? As1 : As2;

            const a = (As * fy_kNcm2) / (0.85 * fck_kNcm2 * b);

            if (a > 0.85 * beta1 * d) {
                return { As, rho: As / (b * d), a, d, valida: false, mensaje: 'sobrearmado' };
            }

            const rho = As / (b * d);
            // rho_min y rho_max se calculan con fck_mpa y fy_mpa directamente (fórmulas ACI estándar en MPa)
            const rho_min = Math.max(0.25 * Math.sqrt(fck_mpa) / fy_mpa, 1.4 / fy_mpa);
            const rho_max = 0.75 * (0.85 * fck_mpa * beta1 * 0.003) / (fy_mpa * (0.003 + 0.005));

            let valida = true;
            let mensaje = 'OK';
            if (rho < rho_min) {
                valida = false;
                mensaje = `rho<rho_min (${(rho*100).toFixed(3)}% < ${(rho_min*100).toFixed(3)}%)`;
            } else if (rho > rho_max) {
                valida = false;
                mensaje = `rho>rho_max (${(rho*100).toFixed(3)}% > ${(rho_max*100).toFixed(3)}%)`;
            }

            return { As, rho, a, d, valida, mensaje, rho_min, rho_max };
        }

        // ================================================================
        //  GENERAR COMBINACIONES DE BARRAS
        // ================================================================

        const areaBarras = {
            8: 0.503,
            10: 0.785,
            12: 1.131,
            14: 1.539,
            16: 2.011,
            18: 2.545,
            20: 3.142,
            22: 3.801
        };

        // Búsqueda limitada de alternativas de área; no optimiza la disposición física.
        function generarCombinaciones(AsRequerido, diametros, limite = 10) {
            if (!Number.isFinite(AsRequerido) || AsRequerido <= 0 ||
                !Array.isArray(diametros) || diametros.length === 0 ||
                diametros.some(d => !Object.hasOwn(areaBarras, d)) ||
                !Number.isInteger(limite) || limite <= 0) return [];

            const diametrosUnicos = [...new Set(diametros.map(Number))].sort((a, b) => a - b);
            // Las áreas tabuladas tienen tres decimales: acumular enteros evita errores
            // de suma. Redondear la demanda hacia arriba nunca admite menos acero.
            const areas = diametrosUnicos.map(d => Math.round(areaBarras[d] * 1000));
            const requerido = Math.ceil(AsRequerido * 1000);
            if (!Number.isSafeInteger(requerido)) return [];
            const maxArea = Math.max(Math.ceil(requerido * 1.3), requerido + Math.max(...areas));
            const combinaciones = [];
            const cantidades = new Array(areas.length).fill(0);
            let visitados = 0;
            const maxVisitados = 25000;

            function buscar(areaAcumulada, indiceActual) {
                if (++visitados > maxVisitados || combinaciones.length >= limite) return;
                if (areaAcumulada >= requerido) {
                    const detalle = diametrosUnicos.flatMap((diametro, i) => cantidades[i] > 0
                        ? [{ diametro, cantidad: cantidades[i], area: cantidades[i] * areas[i] / 1000 }]
                        : []);
                    const areaTotal = areaAcumulada / 1000;
                    combinaciones.push({
                        areaTotal,
                        totalBarras: detalle.reduce((total, item) => total + item.cantidad, 0),
                        excesoPorc: (areaTotal - AsRequerido) / AsRequerido * 100,
                        combinacion: detalle
                    });
                    return;
                }
                if (indiceActual >= areas.length) return;
                const maxBarras = Math.floor((maxArea - areaAcumulada) / areas[indiceActual]);
                for (let n = 0; n <= maxBarras && visitados < maxVisitados && combinaciones.length < limite; n++) {
                    cantidades[indiceActual] = n;
                    buscar(areaAcumulada + n * areas[indiceActual], indiceActual + 1);
                }
                cantidades[indiceActual] = 0;
            }
            buscar(0, 0);
            return combinaciones.sort((a, b) => a.areaTotal - b.areaTotal || a.totalBarras - b.totalBarras);
        }

        // ================================================================
        //  OPTIMIZAR CON PARETO
        // ================================================================

        function optimizar() {
            const Mu_kN = parseFloat(document.getElementById('Mu').value);
            const L = parseFloat(document.getElementById('L').value);
            const fck = document.getElementById('fck').value;
            const fy = document.getElementById('fy').value;
            const costoHormigon = parseFloat(document.getElementById('costH').value);
            const costoAcero = parseFloat(document.getElementById('costA').value);
            const rec = parseFloat(document.getElementById('rec').value);
            const bMin = parseFloat(document.getElementById('bMin').value);
            const bMax = parseFloat(document.getElementById('bMax').value);
            const hMin = parseFloat(document.getElementById('hMin').value);
            const hMax = parseFloat(document.getElementById('hMax').value);

            const checkboxes = document.querySelectorAll('.checkbox-item input[type="checkbox"]:checked');
            const diametros = Array.from(checkboxes).map(cb => parseInt(cb.value)).sort((a, b) => a - b);

            const valoresPositivos = [Mu_kN, L, Number(fck), Number(fy), bMin, bMax, hMin, hMax, rec];
            let error = '';
            if (valoresPositivos.some(valor => !Number.isFinite(valor) || valor <= 0) ||
                [costoHormigon, costoAcero].some(valor => !Number.isFinite(valor) || valor < 0)) {
                error = 'Completa los parámetros con números válidos: dimensiones, cargas y resistencias positivas; costos no negativos.';
            } else if (bMin > bMax || hMin > hMax) {
                error = 'El mínimo de cada rango debe ser menor o igual que el máximo.';
            } else if (rec >= hMin) {
                error = 'El recubrimiento debe ser menor que la altura mínima del rango.';
            } else if (bMax + 1 === bMax || hMax + 2 === hMax) {
                error = 'Las dimensiones exceden la precisión numérica del barrido. Introduce valores menores en centímetros.';
            } else if ((Math.floor(bMax - bMin) + 1) * (Math.floor((hMax - hMin) / 2) + 1) > 5000) {
                error = 'Reduce los rangos para evaluar como máximo 5.000 secciones por cálculo.';
            } else if (diametros.length === 0) {
                error = 'Selecciona al menos un diámetro de barra.';
            }
            if (error) return { puntosValidos: [], mejor: null, error };

            let candidatos = [];
            // Contadores de diagnóstico: por qué se descarta cada combinación
            let motivos = { dNegativo: 0, discNegativo: 0, sobrearmado: 0, rhoMin: 0, rhoMax: 0 };
            let peorRho = null; // la combinación con rho más alto (la "menos mala" de las rechazadas por rho_min)

            for (let b = bMin; b <= bMax; b += 1) {
                for (let h = hMin; h <= hMax; h += 2) {
                    const resAcero = calcularAcero(Mu_kN, b, h, fck, fy, rec);

                    if (!resAcero.valida) {
                        if (resAcero.mensaje === 'd<=0') motivos.dNegativo++;
                        else if (resAcero.mensaje === 'disc<0') motivos.discNegativo++;
                        else if (resAcero.mensaje === 'sobrearmado') motivos.sobrearmado++;
                        else if (resAcero.mensaje && resAcero.mensaje.startsWith('rho<rho_min')) {
                            motivos.rhoMin++;
                            // Guardar la sección más pequeña (la que se acerca más a necesitar rho_min)
                            if (!peorRho || (resAcero.rho > peorRho.rho)) {
                                peorRho = { b, h, rho: resAcero.rho, rho_min: resAcero.rho_min, As: resAcero.As };
                            }
                        }
                        else if (resAcero.mensaje && resAcero.mensaje.startsWith('rho>rho_max')) {
                            motivos.rhoMax++;
                        }
                        continue;
                    }

                    const { As, rho, a, d } = resAcero;

                    const Vol = (b * h / 10000) * L;
                    const pesoAcero = (As / 10000) * L * 7850;
                    const costoConcreto = Vol * costoHormigon;
                    const costoAceroMat = pesoAcero * costoAcero;
                    const costoTotal = costoConcreto + costoAceroMat;

                    // ---- ROBUSTEZ REAL (margen de ductilidad) ----
                    // rho_max es el límite donde la falla pasa de dúctil (acero fluye primero)
                    // a frágil (concreto aplasta primero). Cuanto más lejos esté rho de rho_max
                    // -y más cerca de rho_min-, mayor reserva de ductilidad y seguridad tiene la
                    // sección. Se normaliza 0 (al límite, poco dúctil) -> 1 (muy dúctil, máx reserva).
                    const robustez = Math.max(0, Math.min(1,
                        (resAcero.rho_max - rho) / (resAcero.rho_max - resAcero.rho_min)
                    ));

                    candidatos.push({
                        b: b, h: h, d: d,
                        As: As, rho: rho, a: a,
                        costoConcreto: costoConcreto,
                        costoAceroMat: costoAceroMat,
                        costo: costoTotal,
                        peso: pesoAcero,
                        robustez: robustez,
                        Vol: Vol,
                        valida: true
                    });
                }
            }

            if (candidatos.length === 0) {
                mostrarDiagnostico(motivos, peorRho, { bMin, bMax, hMin, hMax, Mu_kN });
                return { puntosValidos: [], mejor: null, combinacionesOptimas: [] };
            }

            // Filtrado de Pareto: una sección es ineficiente si otra es igual o mejor
            // en costo Y en robustez, y estrictamente mejor en al menos una de las dos.
            let paretoOptimos = [];
            for (let c1 of candidatos) {
                let dominado = candidatos.some(c2 =>
                    c2.costo <= c1.costo && c2.robustez >= c1.robustez &&
                    (c2.costo < c1.costo || c2.robustez > c1.robustez)
                );
                if (!dominado) paretoOptimos.push(c1);
            }

            // ---- Calcular SIEMPRE las 3 óptimas (no solo la del criterio activo) ----
            const optima_costo = candidatos.reduce((a, b) => a.costo < b.costo ? a : b);

            const optima_economica = paretoOptimos.reduce((best, curr) => {
                const score_curr = curr.costo * (1 - 0.25 * curr.robustez);
                const score_best = best.costo * (1 - 0.25 * best.robustez);
                return score_curr < score_best ? curr : best;
            });

            const optima_robusta = paretoOptimos.reduce((a, b) =>
                a.robustez > b.robustez ? a : (a.robustez === b.robustez && a.costo < b.costo ? a : b)
            );

            // La sección resaltada en gráficos/tabla depende del selector de criterio
            let mejor;
            if (criterioActual === 'optimal') mejor = optima_costo;
            else if (criterioActual === 'economic') mejor = optima_economica;
            else mejor = optima_robusta;

            // Top 10 por costo, para la tabla de "todas las opciones"
            const top10 = [...candidatos].sort((a, b) => a.costo - b.costo).slice(0, 10);

            return {
                puntosValidos: candidatos,
                mejor: mejor,
                optima_costo: optima_costo,
                optima_economica: optima_economica,
                optima_robusta: optima_robusta,
                top10: top10,
                paretoOptimos: paretoOptimos
            };
        }

        // ================================================================
        //  DIAGNÓSTICO CUANDO NO HAY COMBINACIONES VÁLIDAS
        // ================================================================

        function mostrarDiagnostico(motivos, peorRho, params) {
            const total = motivos.dNegativo + motivos.discNegativo + motivos.sobrearmado + motivos.rhoMin + motivos.rhoMax;
            let causaPrincipal = Object.entries(motivos).sort((a, b) => b[1] - a[1])[0];
            let mensaje = '';
            let sugerencia = '';

            if (causaPrincipal[0] === 'rhoMin' && motivos.rhoMin === total) {
                // Todas las secciones son DEMASIADO GRANDES para este Mu -> cuantía mínima no se alcanza
                mensaje = `Con Mu = ${params.Mu_kN} kN·m, todas las secciones evaluadas (b: ${params.bMin}-${params.bMax} cm, h: ${params.hMin}-${params.hMax} cm) están <strong>sobredimensionadas</strong>: el acero requerido por flexión es tan bajo que no alcanza la cuantía mínima del código.`;

                // Sugerir un h_max razonable: usar la sección más pequeña que casi cumplió
                if (peorRho) {
                    const factorReduccion = Math.sqrt(peorRho.rho_min / peorRho.rho) || 0.5;
                    const hSugerido = Math.max(20, Math.round(peorRho.h * factorReduccion));
                    const bSugerido = Math.max(15, Math.round(peorRho.b * factorReduccion));
                    sugerencia = `Prueba reduciendo el rango: b entre 15-${bSugerido} cm, h entre 20-${hSugerido} cm. Cuanto menor el momento, menor debe ser la sección — la cuantía mínima existe para evitar vigas "de adorno" con muy poco acero.`;
                } else {
                    sugerencia = `Reduce h_max a valores entre 20-40 cm para momentos de esta magnitud.`;
                }
            } else if (causaPrincipal[0] === 'rhoMax' && motivos.rhoMax === total) {
                mensaje = `Con Mu = ${params.Mu_kN} kN·m, todas las secciones evaluadas están <strong>subdimensionadas</strong>: se necesitaría más acero del que el código permite (cuantía máxima superada) — riesgo de falla frágil.`;
                sugerencia = `Aumenta el rango: prueba con b entre ${params.bMax}-${params.bMax + 20} cm, h entre ${params.hMax}-${params.hMax + 30} cm, o sube f'c.`;
            } else if (causaPrincipal[0] === 'sobrearmado' && motivos.sobrearmado === total) {
                mensaje = `Todas las secciones resultan <strong>sobrearmadas</strong> (el bloque de compresión "a" excede el límite permitido).`;
                sugerencia = `Aumenta el ancho b o el peralte h del rango de búsqueda.`;
            } else if (causaPrincipal[0] === 'dNegativo' && motivos.dNegativo === total) {
                mensaje = `El peralte efectivo (d = h − recubrimiento) resulta negativo o muy pequeño para valores bajos de h.`;
                sugerencia = `Aumenta h_min por encima del recubrimiento (actualmente ${document.getElementById('rec').value} cm) más un margen razonable (h_min ≥ 20-25 cm).`;
            } else {
                mensaje = `No se encontraron secciones válidas. Causas mixtas detectadas: ${Object.entries(motivos).filter(([k,v]) => v > 0).map(([k,v]) => `${k}: ${v}`).join(', ')}.`;
                sugerencia = `Prueba ampliar el rango de b y h, o revisa que Mu, f'c y fy sean coherentes entre sí.`;
            }

            const html = `
                <div style="background: var(--fail-bg); border-left: 4px solid var(--fail); padding: 20px; border-radius: 6px;">
                    <h3 style="margin-top:0; color: var(--fail);">⚠️ No se encontraron secciones válidas en el rango dado</h3>
                    <p style="margin-bottom: 12px;">${mensaje}</p>
                    <div style="background: #fff; border: 1px solid var(--border); border-radius: 4px; padding: 14px; margin-bottom: 12px;">
                        <strong>💡 Sugerencia:</strong> ${sugerencia}
                    </div>
                    <div style="font-size: 12px; color: var(--ink-soft);">
                        Diagnóstico técnico: ${total} combinaciones evaluadas —
                        ${motivos.rhoMin > 0 ? `${motivos.rhoMin} bajo cuantía mín. ` : ''}
                        ${motivos.rhoMax > 0 ? `${motivos.rhoMax} sobre cuantía máx. ` : ''}
                        ${motivos.sobrearmado > 0 ? `${motivos.sobrearmado} sobrearmadas. ` : ''}
                        ${motivos.dNegativo > 0 ? `${motivos.dNegativo} peralte inválido. ` : ''}
                        ${motivos.discNegativo > 0 ? `${motivos.discNegativo} sección insuficiente. ` : ''}
                    </div>
                </div>
            `;

            document.getElementById('resultadosContainer').innerHTML = html;
            document.getElementById('resultadosContainer').style.display = 'block';
            document.getElementById('chartsSection').style.display = 'none';
            setStatus('Sin combinaciones válidas — ver diagnóstico', '');
        }

        // ================================================================
        //  RENDERIZAR RESULTADOS
        // ================================================================

        function renderizarResultados(resultado) {
            if (!resultado.mejor) return;

            const m = resultado.mejor;
            const oc = resultado.optima_costo;

            const L = parseFloat(document.getElementById('L').value);

            const marcador = (crit) => criterioActual === crit ? ' style="outline: 2px solid var(--accent); outline-offset: -1px;"' : '';
            const diferenciaCosto = costo => oc.costo > 0
                ? `${((costo / oc.costo - 1) * 100).toFixed(1)}% vs óptima`

                        </div>

                        <div style="font-size:12px; color: var(--ink-soft); margin-top:4px;">
                            Costo: $${or_.costo.toFixed(2)} (${diferenciaCosto(or_.costo)})<br>
                            Robustez: ${(or_.robustez*100).toFixed(0)}%
                        </div>
                    </div>
                </div>

                <h3>📊 Sección Seleccionada (según criterio activo)</h3>

                    </div>
                    <div class="summary-item">
                        <div class="summary-item-label">Peralte (h)</div>
                        <div class="summary-item-value">${m.h} cm</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-item-label">Peralte efectivo (d)</div>
                        <div class="summary-item-value">${m.d.toFixed(1)} cm</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-item-label">Acero requerido (As)</div>
                        <div class="summary-item-value">${m.As.toFixed(2)} cm²</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-item-label">Cuantía (ρ)</div>
                        <div class="summary-item-value">${(m.rho * 100).toFixed(2)} %</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-item-label">Costo teórico de materiales</div>
                        <div class="summary-item-value">$${m.costo.toFixed(2)}</div>
                    </div>

                <h3>🏗️ Combinaciones propuestas de barras</h3>
                <p style="color: var(--ink-soft);">Hasta 10 alternativas, ordenadas por exceso de área dentro de una búsqueda limitada. Se comparan áreas; falta verificar disposición y separación de barras.</p>
            `;

            // Generar combinaciones
            const checkboxes = document.querySelectorAll('.checkbox-item input[type="checkbox"]:checked');
            const diametros = Array.from(checkboxes).map(cb => parseInt(cb.value));

            const combinaciones = generarCombinaciones(m.As, diametros, 10);
            if (combinaciones.length === 0) {

                combinaciones.forEach((comb, idx) => {

                    <div class="info-msg">✅ Haz clic en "Seleccionar" para elegir el armado que prefieras.</div>
                `;
            }

            document.getElementById('resultadosContainer').innerHTML = html;
            document.getElementById('resultadosContainer').style.display = 'block';
            document.getElementById('chartsSection').style.display = 'grid';

            // Gráficos
            renderCharts(resultado.puntosValidos, m, resultado.paretoOptimos, resultado);

            // Eventos botones
            document.querySelectorAll('.btn-seleccionar').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.btn-seleccionar').forEach(b => b.classList.remove('seleccionado'));
                    this.classList.add('seleccionado');

            const firstBtn = document.querySelector('.btn-seleccionar');
            if (firstBtn) firstBtn.classList.add('seleccionado');

        // ================================================================
        //  GRÁFICOS
        // ================================================================

        function renderCharts(puntos, mejor, paretoOptimos, resultado) {
            const ctxScatter = document.getElementById('costChart').getContext('2d');
            if (chartScatter) chartScatter.destroy();

            const bValues = puntos.map(p => p.b);
            const minB = Math.min(...bValues);
            const maxB = Math.max(...bValues);
            const rangeB = (maxB - minB) || 1;

            const scatterData = puntos.map(p => ({ x: p.h, y: p.costo, b: p.b }));
            const colores = scatterData.map(p => {
                const ratio = (p.b - minB) / rangeB;
                const r = Math.round(50 + 205 * ratio);
                const b = Math.round(255 - 205 * ratio);
                return `rgba(${r}, 50, ${b}, 0.5)`;
            });

            const datasets = [{
                label: 'Todas las secciones válidas',
                data: scatterData,
                backgroundColor: colores,
                borderColor: colores.map(c => c.replace('0.5', '1')),
                pointRadius: 4,
                pointHoverRadius: 7,
            }];

            if (paretoOptimos && paretoOptimos.length > 0) {
                const paretoData = paretoOptimos.map(p => ({ x: p.h, y: p.costo }));
                datasets.push({
                    label: '◆ Frontera Pareto',
                    data: paretoData,
                    backgroundColor: 'rgba(28, 114, 196, 0.3)',
                    borderColor: 'rgba(28, 114, 196, 1)',
                    pointRadius: 6,
                    pointBorderWidth: 2,
                    pointBorderColor: '#fff',
                    showLine: false,
                });
            }

            // Marcar las 3 óptimas con símbolos distintos (siempre visibles, no solo la del criterio activo)
            if (resultado && resultado.optima_costo) {
                datasets.push({
                    label: '🎯 Óptima (costo)',
                    data: [{ x: resultado.optima_costo.h, y: resultado.optima_costo.costo }],
                    backgroundColor: 'rgba(26, 125, 63, 0.9)',
                    borderColor: 'rgba(26, 125, 63, 1)',
                    pointRadius: 10,
                    pointHoverRadius: 14,
                    pointBorderColor: 'white',
                    pointBorderWidth: 2,
                    pointStyle: 'triangle',
                });
                datasets.push({
                    label: '💰 Económica + Robusta',
                    data: [{ x: resultado.optima_economica.h, y: resultado.optima_economica.costo }],
                    backgroundColor: 'rgba(168, 102, 10, 0.9)',
                    borderColor: 'rgba(168, 102, 10, 1)',
                    pointRadius: 10,
                    pointHoverRadius: 14,
                    pointBorderColor: 'white',
                    pointBorderWidth: 2,
                    pointStyle: 'rectRot',
                });
                datasets.push({
                    label: '🏗️ Máxima Robustez',
                    data: [{ x: resultado.optima_robusta.h, y: resultado.optima_robusta.costo }],
                    backgroundColor: 'rgba(28, 114, 196, 0.9)',
                    borderColor: 'rgba(28, 114, 196, 1)',
                    pointRadius: 10,
                    pointHoverRadius: 14,
                    pointBorderColor: 'white',
                    pointBorderWidth: 2,
                    pointStyle: 'rect',
                });
            }

            // Anillo de foco alrededor de la que corresponde al criterio activo del selector
            if (mejor) {
                datasets.push({
                    label: '★ Seleccionada (criterio activo)',
                    data: [{ x: mejor.h, y: mejor.costo }],
                    backgroundColor: 'rgba(0,0,0,0)',
                    borderColor: 'rgba(220, 38, 38, 1)',
                    pointRadius: 18,
                    pointHoverRadius: 20,
                    pointBorderWidth: 3,
                });
            }

            chartScatter = new Chart(ctxScatter, {
                type: 'scatter',
                data: { datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true, labels: { usePointStyle: true, padding: 15 } },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const raw = context.raw;
                                    if (raw.b !== undefined) {
                                        return `b=${raw.b}cm, h=${raw.x}cm, $${raw.y.toFixed(0)}`;
                                    }
                                    return `h=${raw.x}cm, $${raw.y.toFixed(0)}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { title: { display: true, text: 'Peralte (h) [cm]', font: { weight: 'bold' } } },
                        y: { title: { display: true, text: 'Costo Total (USD)', font: { weight: 'bold' } } }
                    }
                }
            });

            // Gráfico de pastel
            const ctxPie = document.getElementById('costPieChart').getContext('2d');
            if (chartPie) chartPie.destroy();

            chartPie = new Chart(ctxPie, {
                type: 'doughnut',
                data: {
                    labels: ['Hormigón', 'Acero'],
                    datasets: [{
                        data: [mejor.costoConcreto, mejor.costoAceroMat],
                        backgroundColor: ['#3b82f6', '#f59e0b'],
                        borderColor: ['#1e40af', '#b45309'],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { usePointStyle: true, padding: 12 } },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    if (total === 0) return `${context.label}: $0`;
                                    const pct = ((context.parsed / total) * 100).toFixed(1);
                                    return `${context.label}: $${context.parsed.toFixed(0)} (${pct}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }

        // ================================================================
        //  CONTROLES
        // ================================================================

        function cambiarCriterio(valor) {
            criterioActual = valor;
            if (document.getElementById('resultadosContainer').style.display !== 'none') {
                calcular();
            }
        }

        function calcular() {
            setStatus('Optimizando...', '');
            setTimeout(() => {
                const resultado = optimizar();
                if (resultado.error) {
                    const contenedor = document.getElementById('resultadosContainer');
                    contenedor.textContent = resultado.error;
                    contenedor.style.display = 'block';
                    document.getElementById('chartsSection').style.display = 'none';
                    setStatus('Revisa los parámetros', '');
                    return;
                }
                if (!resultado.mejor) return; // Conservar el diagnóstico y su estado.
                renderizarResultados(resultado);
                setStatus('Optimización completada', '');
            }, 100);
        }

        function setStatus(msg, detail) {
            document.getElementById('statusText').textContent = msg + (detail ? ` — ${detail}` : '');
        }

        window.addEventListener('DOMContentLoaded', function() {
            setStatus('Listo', '');
            setTimeout(calcular, 500);
        });
    </script>

</body>
</html>
