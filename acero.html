<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de Áreas de Acero - Symmetrica</title>
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/sf-pro-display" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'SF Pro Display', -apple-system, sans-serif; background: #f8fafc; }
        .glass-card { background: rgba(255,255,255,0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.5); }
        .btn-primary { background: #4f46e5; color: white; padding: 0.5rem 1.5rem; border-radius: 9999px; font-weight: 600; transition: 0.2s; }
        .btn-primary:hover { background: #4338ca; }
    </style>
</head>
<body>
    <div class="max-w-4xl mx-auto p-6">
        <div class="glass-card rounded-3xl shadow-xl p-8">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-3xl font-bold text-gray-800">🔩 Calculadora de Áreas de Acero</h1>
                <a href="index.html" class="text-sm text-blue-600 hover:underline">← Volver</a>
            </div>
            <p class="text-gray-500 text-sm mb-6">Agrega grupos de barras (cantidad + diámetro) y calcula el área total en cm².</p>

            <div id="gruposAcero" class="space-y-2">
                <div class="flex gap-3 items-center grupo-acero">
                    <input type="number" placeholder="Cant." class="w-20 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400" />
                    <select class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400">
                        <option value="0.32">6 mm</option>
                        <option value="0.50">8 mm</option>
                        <option value="0.79">10 mm</option>
                        <option value="1.13">12 mm</option>
                        <option value="1.54">14 mm</option>
                        <option value="2.01">16 mm</option>
                        <option value="2.54">18 mm</option>
                        <option value="3.14">20 mm</option>
                        <option value="3.80">22 mm</option>
                        <option value="4.91">25 mm</option>
                        <option value="6.16">28 mm</option>
                        <option value="7.07">30 mm</option>
                        <option value="8.04">32 mm</option>
                    </select>
                    <button onclick="eliminarGrupo(this)" class="text-red-500 hover:text-red-700 text-sm">✕</button>
                </div>
            </div>

            <div class="flex flex-wrap gap-3 mt-4">
                <button onclick="agregarGrupo()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-4 py-2 rounded-lg transition">+ Agregar Grupo</button>
                <button onclick="calcularArea()" class="btn-primary">Calcular Área Total</button>
                <button onclick="limpiarTodo()" class="text-gray-400 hover:text-gray-600 text-sm px-3 py-2">Limpiar todo</button>
            </div>

            <div id="resultadoAcero" class="mt-6 p-4 bg-green-50 border border-green-200 rounded-2xl hidden">
                <p class="font-semibold text-gray-700">📐 Área Total:</p>
                <div id="resultadoAceroContent" class="text-xl font-bold text-green-700"></div>
                <div id="detalleAcero" class="text-sm text-gray-500 mt-1"></div>
            </div>
        </div>
    </div>

    <script type="module">
        // ============================================================
        // VERIFICACIÓN DE ACCESO
        // ============================================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCt_Nas76jJSMjqhsNj1V9MXKxwcIDB2lQ",
            authDomain: "symmetrica-ingenieria.firebaseapp.com",
            projectId: "symmetrica-ingenieria",
            storageBucket: "symmetrica-ingenieria.firebasestorage.app",
            messagingSenderId: "761818327436",
            appId: "1:761818327436:web:d907fb1a8012706a250ea9",
            measurementId: "G-VJMSWR95CC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const TOOL_ID = 'calculadora_areas_acero';

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'index.html'; return; }
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (!userDoc.exists()) { window.location.href = 'index.html'; return; }
            const purchased = userDoc.data().purchasedTools || [];
            if (!purchased.includes(TOOL_ID)) {
                alert('⛔ No tienes acceso a esta herramienta.');
                window.location.href = 'index.html';
            }
        });

        // ============================================================
        // FUNCIONES DE LA CALCULADORA
        // ============================================================
        window.agregarGrupo = function() {
            const container = document.getElementById('gruposAcero');
            const grupo = document.createElement('div');
            grupo.className = 'flex gap-3 items-center grupo-acero';
            grupo.innerHTML = `
                <input type="number" placeholder="Cant." class="w-20 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400" />
                <select class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400">
                    <option value="0.32">6 mm</option>
                    <option value="0.50">8 mm</option>
                    <option value="0.79">10 mm</option>
                    <option value="1.13">12 mm</option>
                    <option value="1.54">14 mm</option>
                    <option value="2.01">16 mm</option>
                    <option value="2.54">18 mm</option>
                    <option value="3.14">20 mm</option>
                    <option value="3.80">22 mm</option>
                    <option value="4.91">25 mm</option>
                    <option value="6.16">28 mm</option>
                    <option value="7.07">30 mm</option>
                    <option value="8.04">32 mm</option>
                </select>
                <button onclick="eliminarGrupo(this)" class="text-red-500 hover:text-red-700 text-sm">✕</button>
            `;
            container.appendChild(grupo);
        };

        window.eliminarGrupo = function(btn) {
            const grupo = btn.closest('.grupo-acero');
            if (document.querySelectorAll('.grupo-acero').length > 1) {
                grupo.remove();
            } else {
                alert('Debe haber al menos un grupo.');
            }
        };

        window.limpiarTodo = function() {
            document.querySelectorAll('.grupo-acero input').forEach(inp => inp.value = '');
            document.getElementById('resultadoAcero').classList.add('hidden');
        };

        window.calcularArea = function() {
            const grupos = document.querySelectorAll('.grupo-acero');
            let total = 0;
            let detalles = [];

            grupos.forEach(g => {
                const cant = parseFloat(g.querySelector('input').value) || 0;
                const area = parseFloat(g.querySelector('select').value);
                const subtotal = cant * area;
                total += subtotal;
                if (cant > 0) {
                    const diametro = g.querySelector('select').selectedOptions[0].text;
                    detalles.push(`${cant} Ø${diametro} (${subtotal.toFixed(2)} cm²)`);
                }
            });

            const resultDiv = document.getElementById('resultadoAcero');
            const content = document.getElementById('resultadoAceroContent');
            const detalle = document.getElementById('detalleAcero');
            resultDiv.classList.remove('hidden');
            content.textContent = `${total.toFixed(2)} cm²`;
            detalle.textContent = detalles.length ? detalles.join(' | ') : 'No hay barras ingresadas.';
        };
    </script>
</body>
</html>
