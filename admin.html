<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Civil Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged,
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            query, 
            where, 
            getDocs, 
            onSnapshot, 
            doc, 
            updateDoc, 
            arrayUnion,
            getDoc,
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      
const firebaseConfig = {
  apiKey: "AIzaSyCt_Nas76jJSMjqhsNj1V9MXKxwcIDB2lQ",
  authDomain: "symmetrica-ingenieria.firebaseapp.com",
  projectId: "symmetrica-ingenieria",
  storageBucket: "symmetrica-ingenieria.firebasestorage.app",
  messagingSenderId: "761818327436",
  appId: "1:761818327436:web:d907fb1a8012706a250ea9",
  measurementId: "G-VJMSWR95CC"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const requestsList = document.getElementById('requestsList');
        const adminInfo = document.getElementById('adminInfo');

        // Cerrar sesión
        window.logout = async () => {
            await signOut(auth);
        };

        // Aprobar solicitud
        window.approveRequest = async (requestId, userId, toolId) => {
            if (!confirm('¿Seguro que quieres aprobar este acceso? Se desbloqueará para el usuario.')) return;

            try {
                // 1. Actualizar el estado de la solicitud a 'approved'
                const requestRef = doc(db, "requests", requestId);
                await updateDoc(requestRef, {
                    status: 'approved',
                    approvedAt: serverTimestamp()
                });

                // 2. Agregar el toolId a la lista de compras del usuario
                const userRef = doc(db, "users", userId);
                await updateDoc(userRef, {
                    purchasedTools: arrayUnion(toolId)
                });

                alert('✅ Acceso concedido exitosamente. El usuario ya puede usar el programa.');
            } catch (error) {
                alert('Error al aprobar: ' + error.message);
            }
        };

        // Cargar solicitudes pendientes en tiempo real
        function loadRequests() {
            const q = query(collection(db, "requests"), where("status", "==", "pending"));
            
            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    requestsList.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500">🎉 No hay solicitudes pendientes.</div>`;
                    return;
                }

                let html = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    html += `
                        <div class="bg-white rounded-xl shadow p-6 border-l-4 border-yellow-400 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <p class="font-bold text-lg text-gray-800">${data.toolName || 'Programa'}</p>
                                <p class="text-sm text-gray-600">👤 ${data.userName || data.userEmail}</p>
                                <p class="text-sm text-gray-500">📧 ${data.userEmail}</p>
                                <p class="text-xs text-gray-400">Solicitado: ${data.requestedAt?.toDate?.()?.toLocaleString() || 'Reciente'}</p>
                            </div>
                            <button onclick="approveRequest('${doc.id}', '${data.userId}', '${data.toolId}')" class="bg-green-500 hover:bg-green-600 text-white font-bold px-6 py-2 rounded-lg transition whitespace-nowrap">
                                ✅ Aprobar Pago (20 Bs)
                            </button>
                        </div>
                    `;
                });
                requestsList.innerHTML = html;
            });
        }

        // Autenticación
        onAuthStateChanged(auth, (user) => {
            if (user) {
                adminInfo.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="font-medium">${user.email}</span>
                        <button onclick="logout()" class="bg-red-500 text-white px-4 py-1 rounded hover:bg-red-600">Salir</button>
                    </div>
                `;
                loadRequests();
            } else {
                // Redirigir al login o mostrar mensaje
                document.body.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center bg-gray-100">
                        <div class="bg-white p-8 rounded-2xl shadow-xl text-center">
                            <h1 class="text-2xl font-bold text-red-600">⛔ Acceso Restringido</h1>
                            <p class="text-gray-600 mt-2">Debes iniciar sesión como administrador.</p>
                            <a href="index.html" class="mt-4 inline-block bg-blue-600 text-white px-6 py-2 rounded">Ir al Login</a>
                        </div>
                    </div>
                `;
            }
        });

    </script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-md p-4 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-800">🔐 Panel de Administración</h1>
            <div id="adminInfo"></div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        <h2 class="text-xl font-semibold text-gray-700 mb-4">📋 Solicitudes de Acceso Pendientes</h2>
        <div id="requestsList" class="grid grid-cols-1 gap-4">
            <!-- Cargado por JavaScript -->
        </div>
    </main>
</body>
</html>
